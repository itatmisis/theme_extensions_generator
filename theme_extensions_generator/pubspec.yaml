name: theme_extensions_generator
description: Generates ThemeExtension classes, mixins, lerp/tween logic and ThemeData accessors for Flutter themes
version: 4.0.0
repository: https://github.com/MiiMan/theme_extensions_generator

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  build: '>=5.0.0 <6.0.0'
  analyzer: '>=14.0.0 <15.0.0'
  source_gen: ^4.3.1
  theme_extensions_annotation: '>=1.2.0 <2.0.0'

dev_dependencies:
  build_test: '>=3.5.23 <4.0.0'
  build_runner: '>=2.17.1 <2.18.0'
  lints: '>=6.0.0 <7.0.0'
  test: '>=1.31.0 <2.0.0'
  source_gen_test: '>=1.3.7 <2.0.0'
  flutter:
    sdk: flutter